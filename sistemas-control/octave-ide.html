<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1e1e2e;color:#cdd6f4;display:flex;flex-direction:column}

/* TOP BAR */
.topbar{background:#181825;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;height:42px;flex-shrink:0;z-index:100}
.topbar-brand{color:#cba6f7;font-weight:800;font-size:.9rem;padding:0 1.1rem;border-right:1px solid rgba(255,255,255,.08);height:100%;display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.topbar-links{display:flex;align-items:center;height:100%}
.topbar-links a{color:#6c7086;text-decoration:none;padding:0 .7rem;font-size:.8rem;height:100%;display:flex;align-items:center;border-right:1px solid rgba(255,255,255,.04);transition:.15s}
.topbar-links a:hover{color:#cdd6f4;background:rgba(255,255,255,.04)}
.topbar-right{margin-left:auto;display:flex;align-items:center;height:100%}
.run-btn{background:#a6e3a1;color:#1e1e2e;font-weight:800;font-size:.85rem;border:none;padding:0 1.5rem;height:100%;cursor:pointer;display:flex;align-items:center;gap:.4rem;letter-spacing:.01em}
.run-btn:hover{background:#94e2d8}
.clear-btn{background:transparent;color:#6c7086;font-size:.8rem;border:none;padding:0 .85rem;height:100%;cursor:pointer;border-left:1px solid rgba(255,255,255,.06)}
.clear-btn:hover{color:#cdd6f4;background:rgba(255,255,255,.06)}
.ex-btn{background:transparent;color:#6c7086;font-size:.8rem;border:none;padding:0 .85rem;height:100%;cursor:pointer;border-left:1px solid rgba(255,255,255,.06)}
.ex-btn:hover{color:#cdd6f4;background:rgba(255,255,255,.06)}

/* LAYOUT */
.ide-layout{display:flex;flex:1;overflow:hidden}
.editor-col{display:flex;flex-direction:column;width:50%;border-right:1px solid rgba(255,255,255,.08);overflow:hidden;flex-shrink:0}
.output-col{display:flex;flex-direction:column;flex:1;overflow:hidden}
@media(max-width:860px){.ide-layout{flex-direction:column}.editor-col{width:100%;height:45vh}.output-col{height:55vh}}

/* EDITOR */
.col-header{background:#181825;border-bottom:1px solid rgba(255,255,255,.06);padding:.3rem .75rem;font-size:.73rem;color:#6c7086;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.col-header .fname{color:#cba6f7;font-weight:700}
#editor{flex:1;font-size:13px}

/* OUTPUT TABS */
.out-tabs{display:flex;background:#181825;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.otab{padding:.35rem .9rem;font-size:.76rem;color:#6c7086;cursor:pointer;border-bottom:2px solid transparent}
.otab.active{color:#89b4fa;border-bottom-color:#89b4fa}
.otab:hover:not(.active){color:#cdd6f4}

/* FIGURES */
.figs-scroll{flex:1;overflow-y:auto;padding:.75rem;display:flex;flex-direction:column;gap:.85rem}
.fig-card{background:#181825;border:1px solid rgba(255,255,255,.07);border-radius:8px;overflow:hidden}
.fig-title{padding:.35rem .75rem;font-size:.73rem;color:#6c7086;border-bottom:1px solid rgba(255,255,255,.05)}
.figs-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;color:#45475a;padding:2rem}
.figs-placeholder .ico{font-size:2.5rem}
.figs-placeholder p{font-size:.83rem;text-align:center;max-width:220px;line-height:1.65}
.figs-placeholder kbd{background:#313244;border-radius:4px;padding:.1rem .35rem;font-size:.75rem;color:#cdd6f4}

/* CONSOLE */
.console-scroll{flex:1;overflow-y:auto;padding:.7rem 1rem;font-family:'Consolas','Courier New',monospace;font-size:.8rem;line-height:1.75;display:none}
.console-scroll.vis{display:block}
.cl{display:flex;gap:.6rem;word-break:break-word}
.cl .p{flex-shrink:0;user-select:none}
.cl.out .p{color:#89b4fa}.cl.out .t{color:#cdd6f4}
.cl.err .p{color:#f38ba8}.cl.err .t{color:#f38ba8;font-weight:600}
.cl.warn .p{color:#fab387}.cl.warn .t{color:#fab387}
.cl.info .p{color:#a6e3a1}.cl.info .t{color:#a6e3a1}
.cl.cmd .p{color:#cba6f7}.cl.cmd .t{color:#cba6f7;font-style:italic}

/* EXAMPLES DRAWER */
.drawer{position:fixed;left:0;top:42px;bottom:0;width:240px;background:#181825;border-right:1px solid rgba(255,255,255,.08);transform:translateX(-100%);transition:transform .2s;z-index:200;display:flex;flex-direction:column;overflow:hidden}
.drawer.open{transform:none}
.drawer-header{padding:.65rem .9rem;font-size:.73rem;font-weight:800;color:#cba6f7;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.drawer-list{overflow-y:auto;flex:1}
.ex-item{padding:.6rem .9rem;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);transition:.1s}
.ex-item:hover{background:rgba(255,255,255,.05)}
.ex-item .et{font-size:.82rem;font-weight:600;color:#cdd6f4;display:block;margin-bottom:.12rem}
.ex-item .ed{font-size:.72rem;color:#6c7086}

/* STATUS */
.statusbar{background:#181825;border-top:1px solid rgba(255,255,255,.06);padding:.2rem .9rem;font-size:.72rem;color:#6c7086;display:flex;gap:1.4rem;align-items:center;flex-shrink:0}
.st-ok{color:#a6e3a1}.st-err{color:#f38ba8}.st-run{color:#fab387}
.st-hint{margin-left:auto}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#45475a;border-radius:3px}

<script>
'use strict';
/* ═══════════════════════════════════════════════════════
   POLY MATH
═══════════════════════════════════════════════════════ */
function polyMul(a,b){
  const r=new Array(a.length+b.length-1).fill(0);
  for(let i=0;i<a.length;i++)for(let j=0;j<b.length;j++)r[i+j]+=a[i]*b[j];
  return r;
}
function polyAdd(a,b){
  const L=Math.max(a.length,b.length);
  const A=[...new Array(L-a.length).fill(0),...a];
  const B=[...new Array(L-b.length).fill(0),...b];
  return A.map((v,i)=>v+B[i]);
}
function polyStrip(p){
  const r=[...p];
  while(r.length>1&&Math.abs(r[0])<1e-12)r.shift();
  return r;
}
function polyNorm(p){
  const q=polyStrip(p);
  const a=q[0];
  return q.map(x=>x/a);
}

/* ── Roots (Durand-Kerner) ── */
function polyRoots(c){
  const p=polyNorm([...c]);
  const n=p.length-1;
  if(n<=0)return[];
  if(n===1)return[{re:-p[1],im:0}];
  if(n===2){
    const d=p[1]*p[1]-4*p[2];
    if(d>=0)return[{re:(-p[1]+Math.sqrt(d))/2,im:0},{re:(-p[1]-Math.sqrt(d))/2,im:0}];
    return[{re:-p[1]/2,im:Math.sqrt(-d)/2},{re:-p[1]/2,im:-Math.sqrt(-d)/2}];
  }
  const cAbs=r=>Math.sqrt(r.re*r.re+r.im*r.im);
  const cMul=(a,b)=>({re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re});
  const cDiv=(a,b)=>{const d=b.re*b.re+b.im*b.im;return{re:(a.re*b.re+a.im*b.im)/d,im:(a.im*b.re-a.re*b.im)/d};};
  function horner(cs,z){
    let r={re:cs[0],im:0};
    for(let i=1;i<cs.length;i++)r={re:r.re*z.re-r.im*z.im+cs[i],im:r.re*z.im+r.im*z.re};
    return r;
  }
  let roots=[];
  for(let k=0;k<n;k++){const a=2*Math.PI*k/n;roots.push({re:(0.4+0.07*k)*Math.cos(a),im:(0.4+0.07*k)*Math.sin(a)});}
  for(let iter=0;iter<400;iter++){
    let maxD=0;
    for(let i=0;i<n;i++){
      let den={re:1,im:0};
      for(let j=0;j<n;j++)if(j!==i)den=cMul(den,{re:roots[i].re-roots[j].re,im:roots[i].im-roots[j].im});
      if(cAbs(den)<1e-20)continue;
      const d=cDiv(horner(p,roots[i]),den);
      roots[i]={re:roots[i].re-d.re,im:roots[i].im-d.im};
      maxD=Math.max(maxD,cAbs(d));
    }
    if(maxD<1e-12)break;
  }
  return roots.map(r=>({re:r.re,im:Math.abs(r.im)<1e-8?0:r.im}));
}

/* ── Evaluate polynomial at s=jω ── */
function evalAtJw(c,w){
  let re=0,im=0;
  const n=c.length-1;
  for(let i=0;i<=n;i++){
    const pw=n-i,mag=Math.pow(w,pw);
    switch(pw%4){case 0:re+=c[i]*mag;break;case 1:im+=c[i]*mag;break;case 2:re-=c[i]*mag;break;case 3:im-=c[i]*mag;break;}
  }
  return{re,im};
}

/* ═══════════════════════════════════════════════════════
   TF CLASS
═══════════════════════════════════════════════════════ */
class TF{
  constructor(num,den){
    this._isTF=true;
    this.num=polyStrip([...num]);
    this.den=polyStrip([...den]);
  }
  _op(op,o){
    const B=typeof o==='number'?new TF([o],[1]):o;
    if(op==='+')return new TF(polyAdd(polyMul(this.num,B.den),polyMul(B.num,this.den)),polyMul(this.den,B.den));
    if(op==='-')return new TF(polyAdd(polyMul(this.num,B.den),polyMul(B.num.map(x=>-x),this.den)),polyMul(this.den,B.den));
    if(op==='*')return new TF(polyMul(this.num,B.num),polyMul(this.den,B.den));
    if(op==='/')return new TF(polyMul(this.num,B.den),polyMul(this.den,B.num));
    throw new Error('Unknown TF op: '+op);
  }
  neg(){return new TF(this.num.map(x=>-x),this.den);}
  get poles(){return polyRoots(this.den);}
  get zeros(){return this.num.length>1?polyRoots(this.num):[];}
  get dcgain(){
    const n=this.num[this.num.length-1],d=this.den[this.den.length-1];
    if(Math.abs(d)<1e-12)return Infinity;
    return n/d;
  }
  freqResp(w){
    const N=evalAtJw(this.num,w),D=evalAtJw(this.den,w);
    const d2=D.re*D.re+D.im*D.im;
    if(d2<1e-30)return{re:1e15,im:0};
    return{re:(N.re*D.re+N.im*D.im)/d2,im:(N.im*D.re-N.re*D.im)/d2};
  }
  toString(){
    const s=c=>{
      const n=c.length-1;
      const parts=[];
      for(let i=0;i<=n;i++){
        const v=c[i],pw=n-i;
        if(Math.abs(v)<1e-10)continue;
        const av=Math.abs(v),sign=v<0?'-':parts.length>0?'+':'';
        const coef=av===1&&pw>0?'':av.toFixed(3).replace(/\.?0+$/,'');
        const x=pw===0?'':(pw===1?'s':'s^'+pw);
        parts.push(sign+(coef||'')+x);
      }
      return parts.join('')||'0';
    };
    return`(${s(this.num)}) / (${s(this.den)})`;
  }
}

function tfFeedback(G,H){
  const Hobj=typeof H==='number'?new TF([H],[1]):H;
  return new TF(polyMul(G.num,Hobj.den),polyAdd(polyMul(G.den,Hobj.den),polyMul(G.num,Hobj.num)));
}

/* ═══════════════════════════════════════════════════════
   SIMULATION
═══════════════════════════════════════════════════════ */
function tf2ss(num,den){
  const a0=den[0];
  const d=den.map(x=>x/a0),nb=num.map(x=>x/a0);
  const n=d.length-1;
  const b=[...new Array(d.length-nb.length).fill(0),...nb];
  const D0=b[0];
  const bc=b.slice(1).map((v,i)=>v-D0*d[i+1]);
  const A=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i<n-1?(j===i+1?1:0):-d[n-j]));
  const B=Array.from({length:n},(_,i)=>i===n-1?1:0);
  return{A,B,C:bc,D:D0,n};
}

function simulate(tf,ufn,tEnd,dt){
  dt=dt||Math.min(0.005, tEnd/2000);
  const ss=tf2ss(tf.num,tf.den);
  const{A,B,C,D,n}=ss;
  const steps=Math.floor(tEnd/dt)+1;
  const skip=Math.max(1,Math.floor(steps/1500));
  const t=[],y=[],u=[];
  let x=new Array(n).fill(0);
  for(let k=0;k<steps;k++){
    const tk=k*dt,uk=ufn(tk);
    let yk=D*uk;
    for(let i=0;i<n;i++)yk+=C[i]*x[i];
    if(k%skip===0){t.push(tk);y.push(yk);u.push(uk);}
    const Ax=A.map(row=>row.reduce((s,v,j)=>s+v*x[j],0));
    x=x.map((v,i)=>v+dt*(Ax[i]+B[i]*uk));
  }
  return{t,y,u};
}

/* ═══════════════════════════════════════════════════════
   TOKENIZER
═══════════════════════════════════════════════════════ */
function tokenize(src){
  const toks=[];let i=0;
  const peek=()=>src[i]||'';
  while(i<src.length){
    const c=src[i];
    // whitespace (not newline)
    if(c===' '||c==='\t'||c==='\r'){i++;continue;}
    // comments
    if(c==='%'||c==='#'){while(i<src.length&&src[i]!=='\n')i++;continue;}
    // line continuation
    if(c==='.'&&src[i+1]==='.'&&src[i+2]==='.'){while(i<src.length&&src[i]!=='\n')i++;i++;continue;}
    if(c==='\n'){toks.push({k:'NL'});i++;continue;}
    // numbers
    if(c>='0'&&c<='9'||(c==='.'&&src[i+1]>='0'&&src[i+1]<='9')){
      let s='';
      while(i<src.length&&/[0-9.]/.test(src[i]))s+=src[i++];
      if(i<src.length&&(src[i]==='e'||src[i]==='E')){
        s+=src[i++];
        if(src[i]==='+'||src[i]==='-')s+=src[i++];
        while(i<src.length&&/\d/.test(src[i]))s+=src[i++];
      }
      toks.push({k:'N',v:parseFloat(s)});continue;
    }
    // double-quoted string
    if(c==='"'){let s='';i++;while(i<src.length&&src[i]!=='"')s+=src[i++];i++;toks.push({k:'S',v:s});continue;}
    // single-quoted string or transpose
    if(c==="'"){
      const prev=toks[toks.length-1];
      const isT=prev&&(prev.k==='N'||prev.k==='ID'||prev.k===')'||prev.k===']'||prev.k==="'");
      if(isT){toks.push({k:"'"});i++;continue;}
      let s='';i++;
      while(i<src.length){if(src[i]==="'"&&src[i+1]==="'"){s+="'";i+=2;}else if(src[i]==="'"){break;}else s+=src[i++];}
      i++;toks.push({k:'S',v:s});continue;
    }
    // identifiers / keywords
    if(/[a-zA-Z_]/.test(c)){
      let s='';while(i<src.length&&/[a-zA-Z0-9_]/.test(src[i]))s+=src[i++];
      toks.push({k:'ID',v:s});continue;
    }
    // two-char operators
    const two=src[i]+src[i+1];
    if(['.*','./','.**','.^','==','~=','!=','<=','>=','&&','||','**'].includes(two)){toks.push({k:two});i+=2;continue;}
    // one-char
    toks.push({k:c});i++;
  }
  toks.push({k:'EOF'});
  return toks;
}

/* ═══════════════════════════════════════════════════════
   INTERPRETER
═══════════════════════════════════════════════════════ */
class OctaveInterp{
  constructor(onFigure, onPrint){
    this._fig=onFigure;
    this._print=onPrint;
    this._ws={pi:Math.PI,e:Math.E,eps:2.22e-16,Inf:Infinity,inf:Infinity,NaN:NaN,nan:NaN,true:1,false:0};
    this._curTraces=null;
    this._curLayout=null;
    this._curTitle='';
    this._holdOn=false;
    this._figN=0;
  }

  run(code){
    this._toks=tokenize(code);
    this._pos=0;
    while(this._pk().k!=='EOF'){
      this._skipSep();
      if(this._pk().k==='EOF')break;
      this._stmt();
    }
    this._flushFig();
  }

  /* ── Token helpers ── */
  _pk(off=0){return this._toks[this._pos+off]||{k:'EOF'};}
  _adv(){return this._toks[this._pos++]||{k:'EOF'};}
  _eat(k){const t=this._adv();if(t.k!==k)throw new Error(`Expected '${k}', got '${t.k||t.v}'`);return t;}
  _skipSep(){while(this._pk().k==='NL'||this._pk().k===';')this._adv();}
  _skipLine(){while(this._pk().k!=='NL'&&this._pk().k!==';'&&this._pk().k!=='EOF')this._adv();if(this._pk().k!=='EOF')this._adv();}
  _skipToEnd(){
    let d=0;
    while(this._pk().k!=='EOF'){
      const t=this._pk();
      if(t.k==='ID'&&['for','while','if','switch','function'].includes(t.v))d++;
      if(t.k==='ID'&&(t.v==='end'||t.v==='endfor'||t.v==='endwhile'||t.v==='endif')){
        if(d===0){this._adv();return;}d--;
      }
      this._adv();
    }
  }

  /* ── Statement ── */
  _stmt(){
    const t=this._pk();

    if(t.k==='ID'){
      // ignore
      if(['pkg','clc','clear','clf','close','drawnow','shg','warning','error'].includes(t.v)){this._skipLine();return;}
      if(t.v==='function'||t.v==='endfunction'){this._skipLine();return;}
      if(t.v==='end'||t.v==='endfor'||t.v==='endwhile'||t.v==='endif'){this._adv();this._skipSep();return;}
      if(t.v==='return'){this._adv();this._skipLine();return;}
      if(t.v==='break'||t.v==='continue'){this._adv();this._skipLine();return;}
      if(t.v==='for'){this._for();return;}
      if(t.v==='while'){this._while();return;}
      if(t.v==='if'){this._if();return;}
      if(t.v==='hold'){
        this._adv();
        if(this._pk().k==='ID'){const v=this._adv().v;this._holdOn=(v==='on'||v==='1');}
        this._skipLine();return;
      }
      if(t.v==='figure'){
        this._adv();
        let n=++this._figN;
        if(this._pk().k==='('){this._adv();n=this._expr();this._eat(')');}
        this._newFig('Figure '+n);
        this._skipLine();return;
      }

      // Assignment: name = expr  (but not ==)
      if(this._pk(1).k==='='&&this._pk(2).k!=='='){
        const name=this._adv().v;
        this._adv(); // =
        const val=this._expr();
        this._ws[name]=val;
        const sup=this._pk().k===';';
        this._skipSep();if(!sup)this._printVal(name,val);
        return;
      }
    }

    // Multi-assign: [a,b,...] = expr
    if(t.k==='['){
      this._adv();
      const vars=[];
      while(this._pk().k!==']'&&this._pk().k!=='EOF'){
        if(this._pk().k===','||this._pk().k==='NL'||this._pk().k===';'){this._adv();continue;}
        if(this._pk().k==='ID')vars.push(this._adv().v);
        else{this._adv();}
      }
      this._eat(']');
      if(this._pk().k==='='){
        this._adv();
        const val=this._expr();
        if(Array.isArray(val)&&Array.isArray(val[0])===false){
          // flat array returned from step etc → but step returns [[y],[t]]
          vars.forEach((v,i)=>{this._ws[v]=Array.isArray(val)?val[i]:val;});
        } else if(Array.isArray(val)){
          vars.forEach((v,i)=>{this._ws[v]=val[i];});
        } else {
          if(vars[0])this._ws[vars[0]]=val;
        }
        this._skipSep();return;
      }
      this._skipLine();return;
    }

    // Expression statement
    const val=this._expr();
    this._skipSep();
    if(val!==undefined&&val!==null&&val instanceof TF)this._print(val.toString(),'info');
    else if(typeof val==='number')this._print(String(val),'out');
  }

  _printVal(name,val){
    if(val instanceof TF)this._print(`${name} = TF: ${val.toString()}`,'info');
    else if(Array.isArray(val)){
      if(val.length<=12)this._print(`${name} = [${val.map(v=>typeof v==='number'?+v.toFixed(6):v).join(', ')}]`,'out');
      else this._print(`${name} = [1×${val.length} double]`,'out');
    }else if(typeof val==='number')this._print(`${name} = ${val}`,'out');
    else if(typeof val==='string')this._print(`${name} = '${val}'`,'out');
  }

  /* ── FOR ── */
  _for(){
    this._eat('ID');
    const vn=this._eat('ID').v;
    this._eat('=');
    const range=this._expr();
    this._skipSep();
    const start=this._pos;
    this._skipToEnd();
    const end=this._pos;
    const arr=Array.isArray(range)?range:[range];
    for(const v of arr){
      this._ws[vn]=v;
      this._pos=start;
      while(this._pos<end-1){
        this._skipSep();
        if(this._pos>=end-1)break;
        const t=this._pk();
        if(t.k==='ID'&&(t.v==='end'||t.v==='endfor'))break;
        this._stmt();
      }
      this._pos=end;
    }
  }

  /* ── WHILE ── */
  _while(){
    this._eat('ID');
    const condPos=this._pos;
    this._expr(); // parse once to advance
    this._skipSep();
    const bodyStart=this._pos;
    this._skipToEnd();
    const bodyEnd=this._pos;
    let iters=0;
    while(iters++<5000){
      this._pos=condPos;
      const cond=this._expr();
      if(!cond)break;
      this._skipSep();
      this._pos=bodyStart;
      while(this._pos<bodyEnd-1){
        this._skipSep();
        if(this._pos>=bodyEnd-1)break;
        if(this._pk().k==='ID'&&(this._pk().v==='end'||this._pk().v==='endwhile'))break;
        this._stmt();
      }
    }
    this._pos=bodyEnd;
  }

  /* ── IF ── */
  _if(){
    this._eat('ID');
    const cond=this._expr();
    this._skipSep();
    const bodyStart=this._pos;
    // find else/elseif/end
    let d=0;
    while(this._pk().k!=='EOF'){
      const t=this._pk();
      if(t.k==='ID'&&['for','while','if','switch'].includes(t.v))d++;
      if(t.k==='ID'&&(t.v==='end'||t.v==='else'||t.v==='elseif')&&d===0)break;
      if(t.k==='ID'&&(t.v==='end'||t.v==='endfor'||t.v==='endwhile'||t.v==='endif'))d--;
      this._adv();
    }
    const bodyEnd=this._pos;
    if(cond){
      const saved=this._pos;
      this._pos=bodyStart;
      while(this._pos<bodyEnd){this._skipSep();if(this._pos>=bodyEnd)break;this._stmt();}
      this._pos=bodyEnd;
    }
    if(this._pk().k==='ID'&&(this._pk().v==='else'||this._pk().v==='elseif'))this._skipToEnd();
    else if(this._pk().k==='ID'&&(this._pk().v==='end'||this._pk().v==='endif'))this._adv();
  }

  /* ── Expression parser ── */
  _expr(){return this._range();}
  _range(){
    let v=this._or();
    if(this._pk().k===':'){
      this._adv();const b=this._or();
      if(this._pk().k===':'){this._adv();const c=this._or();return mkRange(v,b,c);}
      return mkRange(v,1,b);
    }
    return v;
  }
  _or(){let v=this._and();while(this._pk().k==='||'){this._adv();const r=this._and();v=(v||r)?1:0;}return v;}
  _and(){let v=this._cmp();while(this._pk().k==='&&'){this._adv();const r=this._cmp();v=(v&&r)?1:0;}return v;}
  _cmp(){
    let v=this._add();
    const ops=['==','~=','!=','<','>','<=','>='];
    while(ops.includes(this._pk().k)){
      const op=this._adv().k;const r=this._add();
      if(op==='==')v=numEq(v,r)?1:0;
      else if(op==='~='||op==='!=')v=numEq(v,r)?0:1;
      else if(op==='<')v=v<r?1:0;else if(op==='>') v=v>r?1:0;
      else if(op==='<=')v=v<=r?1:0;else if(op==='>=')v=v>=r?1:0;
    }
    return v;
  }
  _add(){
    let v=this._mul();
    while(this._pk().k==='+'||this._pk().k==='-'){
      const op=this._adv().k;v=arith(op,v,this._mul());
    }
    return v;
  }
  _mul(){
    let v=this._pow();
    while(['*','.*','/','./'].includes(this._pk().k)){
      const op=this._adv().k;v=arith(op.replace('.',''),v,this._pow());
    }
    return v;
  }
  _pow(){
    let v=this._unary();
    while(this._pk().k==='^'||this._pk().k==='.^'||this._pk().k==='**'){
      this._adv();const r=this._unary();
      v=Array.isArray(v)?v.map(x=>Math.pow(x,r)):Math.pow(v,r);
    }
    return v;
  }
  _unary(){
    if(this._pk().k==='-'){this._adv();const v=this._post();return arith('*',v,-1);}
    if(this._pk().k==='+'){this._adv();}
    if(this._pk().k==='~'||this._pk().k==='!'){this._adv();return this._post()?0:1;}
    return this._post();
  }
  _post(){
    let v=this._primary();
    for(;;){
      if(this._pk().k==="'"){this._adv();}  // transpose (identity for vectors)
      else if(this._pk().k==='('){
        this._adv();
        const idx=this._argList(')');
        this._eat(')');
        if(Array.isArray(v)&&idx.length===1){
          const i=idx[0];
          v=Array.isArray(i)?i.map(x=>v[Math.round(x)-1]):v[Math.round(i)-1];
        }
      }
      else if(this._pk().k==='.'){
        this._adv(); // field access (ignore, just advance)
        if(this._pk().k==='ID')this._adv();
      }
      else break;
    }
    return v;
  }
  _primary(){
    const t=this._pk();
    if(t.k==='N'){this._adv();return t.v;}
    if(t.k==='S'){this._adv();return t.v;}
    if(t.k==='('){this._adv();const v=this._expr();this._eat(')');return v;}
    if(t.k==='['){return this._matrix();}
    if(t.k==='{'){this._adv();while(this._pk().k!=='}')this._adv();this._adv();return[];}
    if(t.k==='ID'){
      const name=this._adv().v;
      if(this._pk().k==='('){
        this._adv();const args=this._argList(')');this._eat(')');
        return this._call(name,args);
      }
      if(name==='pi')return Math.PI;
      if(name==='e')return Math.E;
      if(name==='inf'||name==='Inf')return Infinity;
      if(name==='true')return 1;
      if(name==='false')return 0;
      if(name in this._ws)return this._ws[name];
      // Might be a function called without parens
      return this._call(name,[]);
    }
    throw new Error(`Unexpected token: '${t.k}' ('${t.v||''}')`);
  }
  _matrix(){
    this._eat('[');
    if(this._pk().k===']'){this._adv();return[];}
    const rows=[];let cur=[];
    while(this._pk().k!==']'&&this._pk().k!=='EOF'){
      const t=this._pk();
      if(t.k===';'||t.k==='NL'){
        if(cur.length){rows.push(cur);cur=[];}
        this._adv();continue;
      }
      if(t.k===','){this._adv();continue;}
      cur.push(this._expr());
    }
    this._eat(']');
    if(cur.length)rows.push(cur);
    if(rows.length===0)return[];
    // Flatten: [a, b] where a,b may be arrays → concatenate
    const flat=rows.map(row=>{
      const r=[];
      for(const v of row){
        if(Array.isArray(v))r.push(...v);
        else r.push(v);
      }
      return r;
    });
    if(flat.length===1)return flat[0];
    return flat; // 2D matrix (not fully supported, return as-is)
  }
  _argList(close){
    const args=[];
    while(this._pk().k!==close&&this._pk().k!=='EOF'){
      if(this._pk().k===','||this._pk().k===';'){this._adv();continue;}
      args.push(this._expr());
    }
    return args;
  }

  /* ── Built-in functions ── */
  _call(name,args){
    const ws=this._ws;
    const a0=args[0],a1=args[1],a2=args[2];

    /* ── Math ── */
    const M={
      abs:x=>vm(x,Math.abs),sqrt:x=>vm(x,Math.sqrt),
      sin:x=>vm(x,Math.sin),cos:x=>vm(x,Math.cos),tan:x=>vm(x,Math.tan),
      asin:x=>vm(x,Math.asin),acos:x=>vm(x,Math.acos),atan:x=>vm(x,Math.atan),
      atan2:(y,x)=>Math.atan2(y,x),
      exp:x=>vm(x,Math.exp),log:x=>vm(x,Math.log),log2:x=>vm(x,Math.log2),log10:x=>vm(x,Math.log10),
      floor:x=>vm(x,Math.floor),ceil:x=>vm(x,Math.ceil),round:x=>vm(x,Math.round),
      sign:x=>vm(x,Math.sign),fix:x=>vm(x,Math.trunc),
      real:x=>x,imag:x=>Array.isArray(x)?x.map(()=>0):0,
      mod:(a,b)=>a%b,rem:(a,b)=>a%b,
      max:(...a)=>{const f=a.length===1&&Array.isArray(a[0])?a[0]:a.flat();return Math.max(...f);},
      min:(...a)=>{const f=a.length===1&&Array.isArray(a[0])?a[0]:a.flat();return Math.min(...f);},
      sum:x=>toArr(x).reduce((a,b)=>a+b,0),
      prod:x=>toArr(x).reduce((a,b)=>a*b,1),
      mean:x=>{const a=toArr(x);return a.reduce((s,v)=>s+v,0)/a.length;},
      norm:x=>{const a=toArr(x);return Math.sqrt(a.reduce((s,v)=>s+v*v,0));},
      cumsum:x=>{let s=0;return toArr(x).map(v=>(s+=v));},
      diff:x=>{const a=toArr(x);return a.slice(1).map((v,i)=>v-a[i]);},
      fliplr:x=>toArr(x).slice().reverse(),
      flipud:x=>toArr(x).slice().reverse(),
      sort:x=>toArr(x).slice().sort((a,b)=>a-b),
      length:x=>Array.isArray(x)?x.length:1,
      numel:x=>Array.isArray(x)?x.length:1,
      // size: always return just the length as a scalar for 1D arrays (common use case)
      size:(x,d)=>{
        const rows=Array.isArray(x)?1:1;
        const cols=Array.isArray(x)?x.length:1;
        if(d===1)return rows;
        if(d===2)return cols;
        return[rows,cols];
      },
      rows:x=>1,
      columns:x=>Array.isArray(x)?x.length:1,
      isempty:x=>Array.isArray(x)?x.length===0?1:0:0,
      find:x=>toArr(x).map((v,i)=>v?i+1:0).filter(Boolean),
      any:x=>toArr(x).some(v=>v)?1:0,
      all:x=>toArr(x).every(v=>v)?1:0,
      conv:(a,b)=>polyMul(toArr(a),toArr(b)),
      // array builders - handle scalar OR [rows,cols] arg
      zeros:(...a)=>{const n=resolveSize(a);return new Array(n).fill(0);},
      ones:(...a)=>{const n=resolveSize(a);return new Array(n).fill(1);},
      rand:(...a)=>{const n=resolveSize(a);return Array.from({length:n},()=>Math.random());},
      randn:(...a)=>{const n=resolveSize(a);return Array.from({length:n},()=>{let u=0,v=0;while(!u){u=Math.random();v=Math.random();}return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);});},
      eye:n=>{n=Math.round(typeof n==='number'?n:1);return Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));},
      linspace:(a,b,n=100)=>{n=Math.round(n);if(n<=1)return[a];return Array.from({length:n},(_,i)=>a+(b-a)*i/(n-1));},
      logspace:(a,b,n=50)=>{n=Math.round(n);return Array.from({length:n},(_,i)=>Math.pow(10,a+(b-a)*i/(n-1)));},
      colon:(a,b,c)=>mkRange(a,b,c),
      // string
      num2str:x=>typeof x==='number'?x.toFixed(4):String(x),
      str2num:x=>Number(x),
      str2double:x=>Number(x),
      int2str:x=>String(Math.round(x)),
      sprintf:(fmt,...a)=>fmtStr(fmt,...a),
      printf:(fmt,...a)=>{this._print(fmtStr(fmt,...a),'out');return undefined;},
      fprintf:(fh,fmt,...a)=>{
        // fprintf may have file handle as first arg
        if(typeof fh==='string'){a=[fmt,...a];fmt=fh;}
        this._print(fmtStr(fmt,...a),'out');return undefined;
      },
      disp:x=>{this._print(dispStr(x),'out');return undefined;},
      display:x=>{this._print(dispStr(x),'out');return undefined;},
      title:x=>{this._ensureFig();this._curLayout.title.text=String(x);return undefined;},
      xlabel:x=>{this._ensureFig();this._curLayout.xaxis.title=String(x);return undefined;},
      ylabel:x=>{this._ensureFig();this._curLayout.yaxis.title=String(x);return undefined;},
      legend:()=>undefined,grid:()=>undefined,axis:()=>undefined,
      xlim:r=>{this._ensureFig();this._curLayout.xaxis.range=r;return undefined;},
      ylim:r=>{this._ensureFig();this._curLayout.yaxis.range=r;return undefined;},
      hold:v=>{this._holdOn=(v==='on'||v===1);return undefined;},
      figure:n=>{this._newFig('Figure '+(n||++this._figN));return undefined;},
      clf:()=>{this._newFig(this._curTitle||'Figure');return undefined;},
      subplot:()=>undefined,text:()=>undefined,set:()=>undefined,get:()=>undefined,
      annotation:()=>undefined,patch:()=>undefined,fill:()=>undefined,
    };
    if(name in M)return M[name](...args);

    /* ── Control toolbox ── */
    if(name==='tf'){
      if(args.length===1&&args[0]==='s')return new TF([1,0],[1]);
      const num=toArr(a0||[1]),den=toArr(a1||[1]);
      return new TF(num,den);
    }
    if(name==='zpk'){
      const z=toArr(a0||[]),p=toArr(a1||[]),k=a2||1;
      let num=[k],den=[1];
      for(const zi of z)num=polyMul(num,[1,-zi]);
      for(const pi of p)den=polyMul(den,[1,-pi]);
      return new TF(num,den);
    }
    if(name==='feedback'){
      const H=a1!==undefined?a1:1;
      return tfFeedback(a0,typeof H==='number'?new TF([H],[1]):H);
    }
    if(name==='series')return a0._op('*',a1);
    if(name==='parallel')return a0._op('+',a1);
    if(name==='minreal')return a0;
    if(name==='c2d'||name==='d2c')return a0;
    if(name==='pole'||name==='poles'){
      const ps=(a0 instanceof TF?a0:new TF([1],[1])).poles;
      return ps.map(p=>p.im===0?p.re:`${p.re.toFixed(4)}+${p.im.toFixed(4)}j`);
    }
    if(name==='zero'||name==='zeros'&&a0 instanceof TF){
      return(a0 instanceof TF?a0:new TF([1],[1])).zeros.map(z=>z.re);
    }
    if(name==='dcgain')return(a0 instanceof TF?a0:new TF([1],[1])).dcgain;
    if(name==='isstable')return(a0 instanceof TF?a0:new TF([1],[1])).poles.every(p=>p.re<0)?1:0;

    /* ── Simulation ── */
    if(name==='step') return this._cmdStep(a0,a1);
    if(name==='impulse') return this._cmdImpulse(a0,a1);
    if(name==='lsim') return this._cmdLsim(a0,a1,a2);
    if(name==='bode') return this._cmdBode(a0);
    if(name==='pzmap') return this._cmdPzmap(a0);
    if(name==='margin') return this._cmdMargin(a0);
    if(name==='rlocus'){this._print('rlocus: no implementado — usá pzmap','warn');return undefined;}
    if(name==='sisotool'||name==='pidtool'){this._print(name+': no disponible en browser','warn');return undefined;}

    /* ── Plot ── */
    if(name==='plot')  return this._cmdPlot(args,{});
    if(name==='semilogx')return this._cmdPlot(args,{xlog:true});
    if(name==='semilogy')return this._cmdPlot(args,{ylog:true});
    if(name==='loglog') return this._cmdPlot(args,{xlog:true,ylog:true});
    if(name==='stem')   return this._cmdPlot(args,{mode:'markers+lines'});
    if(name==='scatter')return this._cmdPlot([a0,a1,'k.'],{mode:'markers'});
    if(name==='bar')    return this._cmdBar(args);
    if(name==='hist'||name==='histogram')return this._cmdHist(args);

    // user-defined in workspace
    if(name in ws&&typeof ws[name]==='function')return ws[name](...args);

    // unknown but non-fatal: warn
    this._print(`Función desconocida: '${name}' (ignorada)`,'warn');
    return undefined;
  }

  /* ── Figure helpers ── */
  _newFig(title){
    this._flushFig();
    this._curTraces=[];
    this._curTitle=title;
    this._curLayout=mkLayout(title);
    this._holdOn=false;
  }
  _ensureFig(){if(!this._curTraces)this._newFig('Figure '+(++this._figN));}
  _flushFig(){
    if(this._curTraces&&this._curTraces.length>0){
      this._fig({traces:this._curTraces,layout:this._curLayout,title:this._curTitle});
    }
    this._curTraces=null;this._curLayout=null;
  }

  /* ── step(): plot only if called standalone (no tArg), return values when tArg given ── */
  _cmdStep(G,tArg){
    const tEnd=Array.isArray(tArg)?tArg[tArg.length-1]:tArg||10;
    const sim=simulate(G,()=>1,tEnd);
    const yss=sim.y[sim.y.length-1];
    const ymax=Math.max(...sim.y);
    const os=yss>0.01?Math.max(0,(ymax-yss)/yss*100):0;
    // Always create figure when called as a statement (no tArg means display mode)
    // When tArg is given, typically used for value extraction → still plot for convenience
    this._ensureFig();
    this._curTraces.push({x:sim.t,y:sim.y,type:'scatter',mode:'lines',name:'y(t)',line:{color:'#89b4fa',width:2.5}});
    this._curTraces.push({x:[0,tEnd],y:[1,1],type:'scatter',mode:'lines',name:'Setpoint=1',line:{color:'#6c7086',dash:'dash',width:1.5}});
    if(!this._curLayout.xaxis.title)this._curLayout.xaxis.title='Tiempo (s)';
    if(!this._curLayout.yaxis.title)this._curLayout.yaxis.title='y(t)';
    if(!this._curLayout.title.text||this._curLayout.title.text.startsWith('Figure'))this._curLayout.title.text='Respuesta al Escalón';
    this._curLayout.annotations=[{x:tEnd*0.97,y:yss+0.03,text:`y_ss=${yss.toFixed(3)} | OS=${os.toFixed(1)}%`,showarrow:false,xanchor:'right',font:{size:10,color:'#a6adc8'},bgcolor:'rgba(24,24,37,.85)'}];
    // If tArg given, return values (for [y,t]=step(...))
    if(tArg!==undefined)return[sim.y,sim.t];
    return undefined;
  }
  _cmdImpulse(G,tArg){
    const tEnd=Array.isArray(tArg)?tArg[tArg.length-1]:tArg||10;
    const dt=Math.min(0.002,tEnd/1000);
    const sim=simulate(G,(t)=>t<dt?1/dt:0,tEnd,dt);
    this._ensureFig();
    this._curTraces.push({x:sim.t,y:sim.y,type:'scatter',mode:'lines',name:'h(t)',line:{color:'#cba6f7',width:2.5}});
    if(!this._curLayout.title.text||this._curLayout.title.text.startsWith('Figure'))this._curLayout.title.text='Respuesta al Impulso';
    if(tArg!==undefined)return[sim.y,sim.t];
    return undefined;
  }
  _cmdLsim(G,u,t){
    const uArr=toArr(u),tArr=toArr(t);
    if(!tArr.length)throw new Error('lsim: t must be an array');
    const dt=tArr.length>1?tArr[1]-tArr[0]:0.005;
    const tEnd=tArr[tArr.length-1];
    const sim=simulate(G,(tk)=>{const i=Math.round(tk/dt);return uArr[Math.min(i,uArr.length-1)]||0;},tEnd,dt);
    this._ensureFig();
    this._curTraces.push({x:sim.t,y:sim.y,type:'scatter',mode:'lines',name:'y(t)',line:{color:'#89b4fa',width:2.5}});
    this._curTraces.push({x:tArr,y:uArr,type:'scatter',mode:'lines',name:'u(t)',line:{color:'#fab387',dash:'dot',width:1.5}});
    if(!this._curLayout.title.text||this._curLayout.title.text.startsWith('Figure'))this._curLayout.title.text='Simulación lsim';
    return[sim.y,sim.t];
  }
  _cmdBode(G){
    this._flushFig();
    const N=300,freqs=Array.from({length:N},(_,i)=>Math.pow(10,-2+5*i/(N-1)));
    const mags=[],phs=[];
    for(const w of freqs){
      const H=G.freqResp(w);
      mags.push(20*Math.log10(Math.sqrt(H.re*H.re+H.im*H.im)+1e-15));
      phs.push(Math.atan2(H.im,H.re)*180/Math.PI);
    }
    let wc=null,pm=null,wp=null,gm=null;
    for(let i=0;i<N-1;i++){if(mags[i]*mags[i+1]<=0&&mags[i]>mags[i+1]){wc=freqs[i];pm=180+phs[i];break;}}
    for(let i=0;i<N-1;i++){if((phs[i]+180)*(phs[i+1]+180)<=0&&phs[i]>phs[i+1]){wp=freqs[i];gm=-mags[i];break;}}
    const shapes1=[{type:'line',x0:freqs[0],x1:freqs[N-1],y0:0,y1:0,line:{color:'#6c7086',dash:'dot',width:1}}];
    const shapes2=[{type:'line',x0:freqs[0],x1:freqs[N-1],y0:-180,y1:-180,line:{color:'#6c7086',dash:'dot',width:1}}];
    if(wc){shapes1.push(vLine(wc,'#a6e3a1'));shapes2.push(vLine(wc,'#a6e3a1'));}
    if(wp){shapes1.push(vLine(wp,'#f38ba8'));shapes2.push(vLine(wp,'#f38ba8'));}
    this._fig({traces:[{x:freqs,y:mags,type:'scatter',mode:'lines',name:'|H| dB',line:{color:'#89b4fa',width:2.5}}],layout:{...mkLayout('Bode — Magnitud'),xaxis:{type:'log',title:'ω (rad/s)',...axStyle()},yaxis:{title:'|H| (dB)',...axStyle()},shapes:shapes1},title:'Bode Magnitud'});
    this._fig({traces:[{x:freqs,y:phs,type:'scatter',mode:'lines',name:'∠H °',line:{color:'#fab387',width:2.5}}],layout:{...mkLayout('Bode — Fase'),xaxis:{type:'log',title:'ω (rad/s)',...axStyle()},yaxis:{title:'∠H (°)',...axStyle()},shapes:shapes2},title:'Bode Fase'});
    if(wc||wp)this._print(`Margen Fase: ${pm?pm.toFixed(2)+'°':'—'}  |  Margen Ganancia: ${gm?gm.toFixed(2)+' dB':'—'}`,'info');
    return undefined;
  }
  _cmdPzmap(G){
    const poles=G.poles,zeros=G.zeros;
    const allR=[...poles,...zeros].map(p=>Math.abs(p.re));
    const allI=[...poles,...zeros].map(p=>Math.abs(p.im));
    const rng=Math.max(...allR,...allI,1)*1.5;
    const stable=poles.every(p=>p.re<0);
    const traces=[];
    if(poles.length)traces.push({x:poles.map(p=>p.re),y:poles.map(p=>p.im),type:'scatter',mode:'markers',name:'Polos',marker:{symbol:'x',size:14,color:'#f38ba8',line:{width:2}}});
    if(zeros.length)traces.push({x:zeros.map(p=>p.re),y:zeros.map(p=>p.im),type:'scatter',mode:'markers',name:'Ceros',marker:{symbol:'circle-open',size:12,color:'#89b4fa',line:{width:2}}});
    const shapes=[
      {type:'rect',x0:-rng,x1:0,y0:-rng,y1:rng,fillcolor:'rgba(166,227,161,.07)',line:{width:0}},
      {type:'rect',x0:0,x1:rng,y0:-rng,y1:rng,fillcolor:'rgba(243,139,168,.07)',line:{width:0}},
      {type:'line',x0:0,x1:0,y0:-rng,y1:rng,line:{color:'#6c7086',dash:'dot',width:1}},
    ];
    const lo={...mkLayout(`Mapa Polos/Ceros — ${stable?'✅ Estable':'⚠️ Inestable'}`),
      xaxis:{title:'Re(s)',range:[-rng,rng],...axStyle()},
      yaxis:{title:'Im(s)',range:[-rng,rng],scaleanchor:'x',...axStyle()},
      shapes,showlegend:true};
    this._ensureFig();
    this._curTraces=traces;
    this._curLayout=lo;
    this._print(stable?'✅ Sistema ESTABLE':'⚠️ Sistema INESTABLE',stable?'info':'warn');
    poles.forEach(p=>this._print(`  polo: ${p.re.toFixed(4)} ${p.im!==0?(p.im>0?'+ ':'- ')+Math.abs(p.im).toFixed(4)+'j':''}`,'out'));
    return undefined;
  }
  _cmdMargin(G){
    const N=300,freqs=Array.from({length:N},(_,i)=>Math.pow(10,-2+5*i/(N-1)));
    const mags=[],phs=[];
    for(const w of freqs){const H=G.freqResp(w);mags.push(20*Math.log10(Math.sqrt(H.re*H.re+H.im*H.im)+1e-15));phs.push(Math.atan2(H.im,H.re)*180/Math.PI);}
    let wc=null,pm=null,wp=null,gm=null;
    for(let i=0;i<N-1;i++){if(mags[i]*mags[i+1]<=0&&mags[i]>mags[i+1]){wc=freqs[i];pm=180+phs[i];break;}}
    for(let i=0;i<N-1;i++){if((phs[i]+180)*(phs[i+1]+180)<=0&&phs[i]>phs[i+1]){wp=freqs[i];gm=-mags[i];break;}}
    this._print(`GM: ${gm?gm.toFixed(3)+' dB':'Inf'} | PM: ${pm?pm.toFixed(2)+'°':'N/A'} | ωc: ${wc?wc.toFixed(4):'N/A'} | ωp: ${wp?wp.toFixed(4):'N/A'}`,'info');
    return[gm||Infinity,pm||0,wc||0,wp||0];
  }
  _cmdPlot(args,opts){
    this._ensureFig();
    if(opts.xlog)this._curLayout.xaxis.type='log';
    if(opts.ylog)this._curLayout.yaxis.type='log';
    let i=0;
    while(i<args.length){
      const x=args[i],y=args[i+1];
      if(Array.isArray(x)&&Array.isArray(y)){
        let style=typeof args[i+2]==='string'?args[i+=2]:'b-';
        const{color,dash,mode}=parseStyle(style);
        this._curTraces.push({x,y,type:'scatter',mode:opts.mode||mode,name:`y${this._curTraces.length+1}`,line:{color,dash,width:2},marker:{color,size:5}});
        i++;
      } else if(Array.isArray(x)&&!Array.isArray(y)){
        // single array → plot as y vs index
        const yy=x;const xx=yy.map((_,j)=>j);
        let style=typeof y==='string'?(i++,y):'b-';
        const{color,dash,mode}=parseStyle(style);
        this._curTraces.push({x:xx,y:yy,type:'scatter',mode:opts.mode||mode,name:`y${this._curTraces.length+1}`,line:{color,dash,width:2},marker:{color,size:5}});
        i++;
      } else {
        i++;
      }
    }
    return undefined;
  }
  _cmdBar(args){
    this._ensureFig();
    const y=toArr(args[1]||args[0]);
    const x=args[1]?toArr(args[0]):y.map((_,i)=>i+1);
    this._curTraces.push({x,y,type:'bar',name:'bar',marker:{color:'#89b4fa'}});
    return undefined;
  }
  _cmdHist(args){
    this._ensureFig();
    this._curTraces.push({x:toArr(args[0]),type:'histogram',name:'hist',marker:{color:'#cba6f7'},nbinsx:args[1]||20});
    return undefined;
  }
}

/* ═══════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════ */
function mkRange(a,step,b){
  const n=Math.round((b-a)/step);
  if(n<0||n>100000)return[];
  return Array.from({length:n+1},(_,i)=>a+i*step);
}
function toArr(v){
  if(Array.isArray(v))return v.flat();
  if(typeof v==='number')return[v];
  return[];
}
function vm(x,fn){return Array.isArray(x)?x.map(fn):fn(x);}
function numEq(a,b){if(Array.isArray(a)||Array.isArray(b))return false;return a===b;}
function resolveSize(args){
  // ones(n), ones(m,n), ones([m,n]) → return scalar length
  if(args.length===2)return Math.round(args[0])*Math.round(args[1]);
  const a=args[0];
  if(Array.isArray(a))return a.reduce((s,v)=>s*Math.round(v),1);
  return Math.round(a)||0;
}
function arith(op,a,b){
  const isTF=x=>x instanceof TF;
  if(isTF(a)||isTF(b)){
    const A=isTF(a)?a:new TF([a],[1]);
    const B=isTF(b)?b:new TF([b],[1]);
    return A._op(op,B);
  }
  if(Array.isArray(a)&&Array.isArray(b)){
    const L=Math.max(a.length,b.length);
    return Array.from({length:L},(_,i)=>{
      const ai=a[i]!==undefined?a[i]:a[a.length-1]||0;
      const bi=b[i]!==undefined?b[i]:b[b.length-1]||0;
      return arith(op,ai,bi);
    });
  }
  if(Array.isArray(a))return a.map(v=>arith(op,v,b));
  if(Array.isArray(b))return b.map(v=>arith(op,a,v));
  if(op==='+')return a+b;if(op==='-')return a-b;if(op==='*')return a*b;
  if(op==='/')return b===0?Infinity:a/b;
  return a;
}
function parseStyle(s){
  const MAP={'b':'#89b4fa','r':'#f38ba8','g':'#a6e3a1','k':'#cdd6f4','m':'#cba6f7','c':'#94e2d8','y':'#f9e2af','w':'#ffffff'};
  let color='#89b4fa',dash='solid',mode='lines';
  for(const[k,v] of Object.entries(MAP)){if(s.includes(k)){color=v;break;}}
  if(s.includes('--'))dash='dash';
  else if(s.includes('-.')||s.includes(':'))dash='dot';
  const hasMark=s.match(/[o.*+xs^v<>dph]/);
  if(hasMark&&s.includes('-'))mode='lines+markers';
  else if(hasMark)mode='markers';
  return{color,dash,mode};
}
function fmtStr(fmt,...args){
  let i=0;
  return String(fmt).replace(/%[-+0-9.]*[diouxXeEfgGsq]/g,m=>{
    const v=args[i++];
    if(v===undefined)return m;
    const spec=m[m.length-1];
    if(spec==='d'||spec==='i')return String(Math.round(Number(v)));
    if(spec==='f'){const pr=parseInt((m.match(/\.(\d+)/)||[,'4'])[1]);return Number(v).toFixed(pr);}
    if(spec==='e'){const pr=parseInt((m.match(/\.(\d+)/)||[,'4'])[1]);return Number(v).toExponential(pr);}
    if(spec==='g'||spec==='G'){return Number(v).toPrecision(6).replace(/\.?0+$/,'');}
    if(spec==='s'||spec==='q')return String(v);
    return Number(v);
  }).replace(/\\n/g,'\n').replace(/\\t/g,'\t');
}
function dispStr(x){
  if(x instanceof TF)return x.toString();
  if(Array.isArray(x)){
    if(x.length<=12)return x.map(v=>typeof v==='number'?v.toFixed(4):String(v)).join('  ');
    return`[1×${x.length} double]`;
  }
  return String(x);
}
function mkLayout(title){
  return{
    title:{text:title,font:{color:'#cdd6f4',size:13}},
    paper_bgcolor:'#181825',plot_bgcolor:'#1e1e2e',
    font:{color:'#cdd6f4',family:'Segoe UI',size:11},
    xaxis:axStyle(),yaxis:axStyle(),
    margin:{t:42,r:16,b:46,l:56},
    showlegend:true,
    legend:{bgcolor:'rgba(24,24,37,.85)',bordercolor:'#313244',borderwidth:1},
  };
}
function axStyle(){return{gridcolor:'#313244',zerolinecolor:'#45475a',title:''};}
function vLine(x,color){return{type:'line',x0:x,x1:x,y0:0,y1:1,yref:'paper',line:{color,dash:'dot',width:1.5}};}

/* ═══════════════════════════════════════════════════════
   UI
═══════════════════════════════════════════════════════ */
let editor;

window.addEventListener('load',()=>{
  editor=ace.edit('editor');
  editor.setTheme('ace/theme/monokai');
  editor.session.setMode('ace/mode/matlab');
  editor.setFontSize(13);
  editor.setOptions({tabSize:2,useSoftTabs:true,showPrintMargin:false,enableBasicAutocompletion:true});
  editor.setValue(EXAMPLES[4].code,-1);
  editor.focus();
  editor.commands.addCommand({name:'run',bindKey:{win:'Ctrl-Enter',mac:'Cmd-Enter'},exec:runCode});

  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='l'){e.preventDefault();clearAll();}
    if(e.key==='Escape')closeDrawer();
  });

  // Build examples list
  const list=document.getElementById('drawer-list');
  EXAMPLES.forEach(ex=>{
    const d=document.createElement('div');d.className='ex-item';
    d.innerHTML=`<span class="et">${ex.title}</span><span class="ed">${ex.desc}</span>`;
    d.onclick=()=>{editor.setValue(ex.code,-1);editor.focus();closeDrawer();};
    list.appendChild(d);
  });
});

function runCode(){
  const code=editor.getValue().trim();
  if(!code)return;

  setSt('Ejecutando...','run');

  // Clear output areas (safe: no getElementById after clear)
  clearFigs();
  clearCons();

  const figures=[];
  const lines=[];

  const interp=new OctaveInterp(
    fig=>figures.push(fig),
    (txt,lvl)=>lines.push({txt,lvl})
  );

  try{
    interp.run(code);
    setSt(`OK — ${figures.length} gráfico(s), ${lines.length} línea(s)`,'ok');
  }catch(err){
    lines.push({txt:err.message,lvl:'err'});
    setSt('Error: '+err.message,'err');
  }

  // Render figures
  const fScroll=document.getElementById('figs-scroll');
  const ph=document.getElementById('placeholder');

  if(figures.length===0){
    ph.style.display='flex';
    ph.innerHTML=`<div class="ico">📭</div><p>Código ejecutado — sin gráficos.<br>Usá <kbd>figure; step(G)</kbd> o <kbd>plot(t,y)</kbd></p>`;
    fScroll.style.display='none';
  } else {
    ph.style.display='none';
    fScroll.style.display='flex';
    figures.forEach((fig,idx)=>{
      const card=document.createElement('div');card.className='fig-card';
      const hdr=document.createElement('div');hdr.className='fig-title';hdr.textContent=fig.title||`Figure ${idx+1}`;
      const div=document.createElement('div');div.id=`fig-${Date.now()}-${idx}`;div.style.minHeight='320px';
      card.appendChild(hdr);card.appendChild(div);fScroll.appendChild(card);
      Plotly.newPlot(div.id,fig.traces,fig.layout,{responsive:true,displaylogo:false,modeBarButtonsToRemove:['sendDataToCloud']});
    });
  }

  // Render console lines
  const cs=document.getElementById('cons-scroll');
  lines.forEach(({txt,lvl})=>{
    const d=document.createElement('div');d.className=`cl ${lvl}`;
    const icons={out:'»',err:'✗',warn:'⚠',info:'ℹ',cmd:'$'};
    d.innerHTML=`<span class="p">${icons[lvl]||'»'}</span><span class="t">${escHtml(txt)}</span>`;
    cs.appendChild(d);
  });

  // Auto-switch to console if no figures but there's output
  if(figures.length===0&&lines.length>0){
    showTab('cons');
  }
}

function clearFigs(){
  const fs=document.getElementById('figs-scroll');
  fs.innerHTML='';
  fs.style.display='none';
  const ph=document.getElementById('placeholder');
  ph.style.display='flex';
  ph.innerHTML=`<div class="ico">📈</div><p>Escribí código Octave y presioná<br><kbd>▶ Ejecutar</kbd> o <kbd>Ctrl+Enter</kbd></p>`;
}
function clearCons(){
  document.getElementById('cons-scroll').innerHTML='';
}
function clearAll(){
  clearFigs();clearCons();setSt('Listo','');
}

function showTab(tab){
  const figs=tab==='figs';
  document.getElementById('tab-figs').classList.toggle('active',figs);
  document.getElementById('tab-cons').classList.toggle('active',!figs);
  const fs=document.getElementById('figs-scroll');
  const ph=document.getElementById('placeholder');
  const cs=document.getElementById('cons-scroll');
  if(figs){
    // show figs or placeholder
    const hasFigs=fs.children.length>0;
    fs.style.display=hasFigs?'flex':'none';
    ph.style.display=hasFigs?'none':'flex';
    cs.classList.remove('vis');
  } else {
    fs.style.display='none';
    ph.style.display='none';
    cs.classList.add('vis');
  }
}

function toggleDrawer(){document.getElementById('drawer').classList.toggle('open');}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');}

function setSt(msg,state){
  const el=document.getElementById('st-txt');
  el.textContent=msg;
  el.className=state==='ok'?'st-ok':state==='err'?'st-err':state==='run'?'st-run':'';
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
